name: Print Software Versions

on:
  push:
    branches:
      - main

jobs:
  PrintLanguageVersions:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Print Python Version
        run: python --version

      - name: Install OpenCV
        run: python -m pip install opencv-contrib-python-headless

      - name: Print OpenCV Version
        run: |
          python -c "import cv2; print('OpenCV version:', cv2.__version__)"
          python -c "import cv2; print('ArUco available:', hasattr(cv2, 'aruco'))"

  PrintDBMSVersions:
    runs-on: ubuntu-24.04
    needs: [PrintLanguageVersions]
    steps:
      - name: Install MongoDB
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg curl
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org

      - name: Print MongoDB Version
        run: mongod --version
