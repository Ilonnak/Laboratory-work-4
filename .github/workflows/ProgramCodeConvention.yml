name: Program Code Convention

on:
  push:
    branches:
      - main
    paths:
      - 'ProgramCode.py'
      - 'ProgramCodeModified.py'
      - '.github/workflows/ProgramCodeConvention.yml'
  workflow_dispatch:

jobs:
  CheckProgramCode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff Linter
        run: python -m pip install ruff

      - name: Check Original Python Code Convention
        run: ruff check ProgramCode.py

      - name: Run Original Python Program
        run: python ProgramCode.py

      - name: Check Modified Python Code Convention
        run: |
          if ruff check --output-format concise ProgramCodeModified.py > ruff-result.txt 2>&1; then
            cat ruff-result.txt
            echo "ERROR: Modified Python code unexpectedly passed linting"
            exit 1
          else
            cat ruff-result.txt
            if grep -q "F841" ruff-result.txt; then
              echo "Expected result: unused variable F841 detected"
            else
              echo "ERROR: Expected F841 violation was not detected"
              exit 1
            fi
          fi

      - name: Run Modified Python Program
        run: python ProgramCodeModified.py
