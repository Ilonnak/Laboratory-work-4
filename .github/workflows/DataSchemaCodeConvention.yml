name: Data Schema Code Convention

on:
  push:
    branches:
      - main
    paths:
      - 'DataSchema.json'
      - 'DataSchemaModified.json'
      - '.github/workflows/DataSchemaCodeConvention.yml'
  workflow_dispatch:

jobs:
  CheckDataSchema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JSON Schema Validator
        run: python -m pip install check-jsonschema

      - name: Validate Modified JSON Schema
        run: check-jsonschema --check-metaschema DataSchemaModified.json
